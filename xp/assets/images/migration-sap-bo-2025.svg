<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f8fd"/><stop offset="1" stop-color="#e6f0fa"/></linearGradient>
<linearGradient id="srv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe3f7"/><stop offset="1" stop-color="#9cc3ea"/></linearGradient>
<linearGradient id="old" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e9f0"/><stop offset="1" stop-color="#c3cdd8"/></linearGradient>
<linearGradient id="arr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bb5a8" stop-opacity="0.3"/><stop offset="1" stop-color="#2bb5a8"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc766"/><stop offset="1" stop-color="#f29a2e"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3d6c9c" flood-opacity="0.18"/></filter>
<g id="unit"><rect x="0" y="0" width="200" height="70" rx="12" fill="#eaf3fc" stroke="#7fa9d6" stroke-width="3"/><circle cx="26" cy="35" r="7" fill="#2bb5a8"/><circle cx="50" cy="35" r="7" fill="#f29a2e"/><rect x="90" y="24" width="90" height="6" rx="3" fill="#9cc3ea"/><rect x="90" y="40" width="90" height="6" rx="3" fill="#9cc3ea"/></g>
<g id="ounit"><rect x="0" y="0" width="120" height="44" rx="8" fill="#eef2f6" stroke="#b3bfcc" stroke-width="3"/><circle cx="18" cy="22" r="5" fill="#b3bfcc"/><rect x="54" y="15" width="54" height="5" rx="2.5" fill="#c8d2dd"/><rect x="54" y="25" width="54" height="5" rx="2.5" fill="#c8d2dd"/></g>
<g id="badge"><circle r="58" fill="#fff" filter="url(#sh)"/></g>
<path id="chev" d="M0 -14 L18 0 L0 14" fill="none" stroke="url(#arr)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="800" cy="460" r="330" fill="#dbe9f7" opacity="0.6"/>
<ellipse cx="800" cy="720" rx="200" ry="18" fill="#bcd3ea" opacity="0.6"/>
<ellipse cx="500" cy="700" rx="110" ry="12" fill="#c8d6e4" opacity="0.6"/>
<!-- old server -->
<g opacity="0.7" filter="url(#sh)">
<rect x="430" y="480" width="140" height="220" rx="14" fill="url(#old)"/>
<use href="#ounit" x="440" y="498"/><use href="#ounit" x="440" y="552"/><use href="#ounit" x="440" y="606"/>
</g>
<!-- arrows -->
<path d="M580 560 C630 520 650 520 680 520" fill="none" stroke="url(#arr)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
<path d="M580 600 C630 600 650 590 680 590" fill="none" stroke="url(#arr)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
<path d="M580 640 C630 680 650 660 680 660" fill="none" stroke="url(#arr)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
<use href="#chev" x="682" y="520"/><use href="#chev" x="682" y="590"/><use href="#chev" x="682" y="660"/>
